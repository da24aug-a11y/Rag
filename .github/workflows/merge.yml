name: Check and merge
on:
  push:
    branches-ignore:
      - master
permissions:
  contents: write
  pull-requests: write
jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      
      - name: Check Syntax
        run: |
          python -m py_compile Frontend/trial.py

      - name: Merge to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head "${{ github.ref_name }}" \
            --title "Auto Merge: ${{ github.ref_name }}" \
            --body "This was automatically created after syntax check passed." \  

          gh pr merge "${{ github.ref_name }}" \
            --merge \
            --delete-branch \